services:
  arma-bot-storage-init:
    build: ./bot
    image: arma3server-arma-bot:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R 10001:10001 /app/data /app/logs
        chmod -R u+rwX,go-rwx /app/data /app/logs
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 20
    mem_limit: 32m
    cpus: 0.10
    volumes:
      - ./bot/data:/app/data
      - ./bot/logs:/app/logs

  arma-bot:
    build: ./bot
    image: arma3server-arma-bot:local
    container_name: arma3-discord-bot
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      arma-bot-storage-init:
        condition: service_completed_successfully
    volumes:
      # Config (read-only inside the container)
      - ./.env:/app/.env:ro
      # SSH private key for host access (generate once with bot/setup-ssh-key.ps1)
      - ./bot/ssh_key:/app/ssh_key:ro
      # Verified local host public key (setup/Export-SshHostKey.ps1)
      - ./bot/ssh:/app/ssh:ro
      # Access rules: copy config/access.example.json to config/access.json first
      # and set BOT_ACCESS_CONFIG=/app/config/access.json to enable multiple guilds.
      - ./config:/app/config:ro
      - ./bot/data:/app/data
      # Persist bot logs on the host
      - ./bot/logs:/app/logs
    extra_hosts:
      # Allows the container to reach the Windows host via 'host.docker.internal'
      - "host.docker.internal:host-gateway"
